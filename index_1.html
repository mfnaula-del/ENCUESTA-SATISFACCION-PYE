<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Encuesta de satisfacción</title>
<style>
:root{
  --papel:#F5F4F0; --carta:#FFFFFF; --tinta:#1A1D1A;
  --oliva:#3F4A3C; --linea:#E2E0DA; --apagado:#7A7C75;
  --senal:#9B2C1F; --ambar:#B8860B;
  --sans:-apple-system,'Segoe UI',system-ui,sans-serif;
  --mono:'SF Mono',Menlo,monospace;
}
body{font-family:var(--sans);background:var(--papel);color:var(--tinta);
  padding:20px 16px;line-height:1.5}
.envoltura{max-width:600px;margin:0 auto}
.carta{background:var(--carta);border:1px solid var(--linea);
  border-radius:12px;padding:16px}
.btn{width:100%;padding:14px;border:0;border-radius:10px;font-size:15px;
  font-weight:600;font-family:inherit;cursor:pointer;margin-top:10px}
.btn-enviar{background:var(--oliva);color:#fff}
.aviso{border-radius:9px;padding:12px 13px;margin-top:11px;font-size:13px;
  line-height:1.5}
.aviso b{display:block;margin-bottom:4px}
.aviso.ok{background:#E3EFE0;color:#2C351F}
.aviso.error{background:#FBEBE8;color:#7B241A}
.aviso.neutro{background:#FDF3E3;color:#5C4210}
.titulo-pantalla{font-size:19px;font-weight:700;margin-bottom:4px}
.subtitulo{font-size:13px;color:var(--apagado);margin-bottom:16px}
.quien{border:1px solid var(--linea);border-radius:8px;padding:12px 13px;font-size:14px}
.quien b{display:block;font-size:16px;margin-bottom:2px}
.campo select{width:100%;padding:11px 12px;border:1px solid var(--linea);border-radius:8px;
  font-family:inherit;font-size:15px;color:var(--tinta);background:#fff;margin-top:8px}
</style>
</head>
<body>
<div class="envoltura">
  <div class="carta" id="contenido"><p>Cargando…</p></div>
</div>

<script>
const URL_BACKEND = 'https://script.google.com/macros/s/AKfycbwPONOVUJ4TKYJbowP9tlOeYWSyrpHYeFaZNgAd6rLousFVsCZVBXzyi-sMiBPRKyin/exec';

function parametro(nombre){ return new URLSearchParams(location.search).get(nombre); }
const PROF_URL = (parametro('prof') || '').toUpperCase();
const ADMIN = parametro('admin') === '1';

const esc = s => String(s ?? '').replace(/[&<>"]/g,
  c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

async function cargar(){
  const cont = document.getElementById('contenido');
  try {
    const r = await fetch(URL_BACKEND);
    const d = await r.json();
    if (!d.ok) throw new Error('El backend no respondió correctamente.');
    dibujar(d.encuestadores);
  } catch (err) {
    cont.innerHTML = '<div class="titulo-pantalla">No se pudo conectar</div>'
      + '<div class="aviso error">' + esc(err.message) + '</div>';
  }
}

function dibujar(encuestadores){
  const cont = document.getElementById('contenido');

  if (ADMIN) {
    const opciones = Object.keys(encuestadores).map(function (cod) {
      const e = encuestadores[cod];
      return '<option value="' + esc(cod) + '">' + esc(e.nombre) + ' — ' + esc(e.rol) + ' (' + esc(e.loc) + ')</option>';
    }).join('');
    cont.innerHTML =
      '<div class="titulo-pantalla">Modo administrador</div>'
      + '<p class="subtitulo">Elige con qué encuestador quieres probar la encuesta.</p>'
      + '<div class="campo"><select id="selector">' + opciones + '</select></div>'
      + '<button class="btn btn-enviar" id="ir">Comenzar encuesta</button>';
    document.getElementById('ir').addEventListener('click', function () {
      const cod = document.getElementById('selector').value;
      location.href = 'encuesta.html?prof=' + cod + '&admin=1';
    });
    return;
  }

  const quien = encuestadores[PROF_URL];
  if (!quien) {
    cont.innerHTML =
      '<div class="titulo-pantalla">Enlace no reconocido</div>'
      + '<div class="aviso error">Este enlace no está asociado a ningún encuestador. Pide tu enlace personal.</div>';
    return;
  }

  cont.innerHTML =
    '<div class="titulo-pantalla">Encuesta de satisfacción</div>'
    + '<p class="subtitulo">Vas a registrar respuestas como:</p>'
    + '<div class="quien"><b>' + esc(quien.nombre) + '</b>' + esc(quien.rol) + ' · ' + esc(quien.loc) + '</div>'
    + '<button class="btn btn-enviar" id="ir">Comenzar encuesta</button>';
  document.getElementById('ir').addEventListener('click', function () {
    location.href = 'encuesta.html' + location.search;
  });
}

cargar();
</script>
</body>
</html>
