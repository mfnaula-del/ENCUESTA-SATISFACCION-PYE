<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sesiones Informativas — Protección</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icono-192.png">
<meta name="theme-color" content="#3F4A3C">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Protección">
<style>
/* Mismas variables que index.html, para mantener la misma identidad visual. */
:root{
  --papel:#F5F4F0; --carta:#FFFFFF; --tinta:#1A1D1A;
  --oliva:#3F4A3C; --linea:#E2E0DA; --apagado:#7A7C75;
  --senal:#9B2C1F; --ambar:#B8860B;
  --sans:-apple-system,'Segoe UI',system-ui,sans-serif;
}
body{font-family:var(--sans);background:var(--papel);color:var(--tinta);
  padding:20px 16px;line-height:1.5}
.envoltura{max-width:600px;margin:0 auto}
.marca{text-align:center;font-weight:700;color:var(--oliva);font-size:14px;
  letter-spacing:.03em;margin-bottom:10px}
.carta{background:var(--carta);border:1px solid var(--linea);border-radius:12px;
  padding:16px;margin-bottom:14px}
.btn{width:100%;padding:14px;border:0;border-radius:10px;font-size:15px;
  font-weight:600;font-family:inherit;cursor:pointer;margin-top:10px;box-sizing:border-box}
.btn-enviar{background:var(--oliva);color:#fff}
.btn-secundario{background:var(--papel);color:var(--oliva);border:1px solid var(--oliva)}
.aviso{border-radius:9px;padding:12px 13px;margin-top:11px;font-size:13px;line-height:1.5}
.aviso b{display:block;margin-bottom:4px}
.aviso.ok{background:#E3EFE0;color:#2C351F}
.aviso.error{background:#FBEBE8;color:#7B241A}
.aviso.neutro{background:#FDF3E3;color:#5C4210}
.titulo-pantalla{font-size:19px;font-weight:700;margin-bottom:4px}
.subtitulo{font-size:13px;color:var(--apagado);margin-bottom:16px}
.quien{border:1px solid var(--linea);border-radius:8px;padding:12px 13px;font-size:14px;
  display:flex;justify-content:space-between;align-items:center}
.quien b{font-size:16px}
.quien button{background:none;border:0;color:var(--apagado);text-decoration:underline;
  font-size:12px;font-family:inherit;cursor:pointer;padding:0}
.etiqueta{display:block;font-size:13px;font-weight:600;color:var(--oliva);margin:14px 0 6px}
.etiqueta:first-child{margin-top:0}
.campo select,.campo input,input[type="text"],input[type="number"],input[type="date"]{
  width:100%;padding:11px 12px;border:1px solid var(--linea);border-radius:8px;
  font-family:inherit;font-size:15px;color:var(--tinta);background:#fff;box-sizing:border-box}
.fila3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.enlace-tenue{display:block;text-align:center;margin-top:16px;font-size:13px;color:var(--apagado);
  text-decoration:underline;background:none;border:0;cursor:pointer;width:100%;font-family:inherit}
.total-vivo{font-size:13px;color:var(--apagado);margin-top:6px;text-align:right}
.total-vivo.mal{color:var(--senal);font-weight:600}
.hoja-card{border:1px solid var(--linea);border-radius:10px;padding:12px 13px;margin-top:12px}
.hoja-card-cabeza{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.hoja-card-cabeza b{font-size:14px}
.marca-revisar{font-size:11px;font-weight:600;color:var(--ambar);background:#FDF3E3;
  padding:3px 8px;border-radius:20px}
.pregunta-fila select{width:100%;padding:9px 10px;border:1px solid var(--linea);border-radius:7px;
  font-family:inherit;font-size:14px;background:#fff}
.girando{display:inline-block;width:16px;height:16px;border:2px solid var(--linea);
  border-top-color:var(--oliva);border-radius:50%;animation:girar 0.8s linear infinite;
  vertical-align:middle;margin-right:8px}
@keyframes girar{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="envoltura">
  <div class="marca">Paz y Esperanza — Protección</div>
  <div id="contenido"><p>Cargando…</p></div>
</div>

<script>
const URL_BACKEND = 'https://script.google.com/macros/s/AKfycbwwss4qHQeZG0jdp3so4_kCihCKUb7AXTalfLlDKCXpll768TlMBYOR0s69ZD-4mecy/exec';

// loc (de identidadLocal, guardado por index.html) -> nombre exacto de la
// pestaña en el Sheets. Tiene que coincidir letra por letra con PESTANAS_VALIDAS
// del backend.
const PESTANA_POR_LOC = { MB: 'Protección Manabí', G: 'Protección Guayaquil', M: 'Protección Milagro' };

// Cantones por localidad, misma forma en las tres herramientas: un arreglo
// por código de localidad. Si tiene más de un cantón, se pregunta cuál; si
// solo tiene uno, la localidad ES el cantón y no se pregunta.
const CANTONES_POR_LOC = {
  MB: ['Manta', 'Montecristi', 'Jaramijo', 'Portoviejo'],
  G: ['Guayaquil'],
  M: ['Milagro']
};

const TEMAS = ['PEAS', 'Cyberbullying', 'VBG', 'Familias constructivas y conflictivas', 'Crianza positiva', 'Nuevas masculinidades'];

// Tiene que coincidir letra por letra con el rol usado en index.html y con
// los ENCUESTADORES del backend de la encuesta.
const ROL_ESPERADO = 'Asistente humanitario de protección';

const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function leerIdentidad() {
  try { return JSON.parse(localStorage.getItem('identidadLocal') || 'null'); } catch (e) { return null; }
}
function borrarIdentidad() { localStorage.removeItem('identidadLocal'); }

async function llamarBackend(cuerpo) {
  const r = await fetch(URL_BACKEND, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify(cuerpo)
  });
  return r.json();
}

function iniciar() {
  const cont = document.getElementById('contenido');
  const identidad = leerIdentidad();

  if (!identidad || identidad.rol !== ROL_ESPERADO) {
    cont.innerHTML =
      '<div class="carta"><div class="titulo-pantalla">Falta tu identidad</div>'
      + '<div class="aviso error">Esta página es para el rol "' + esc(ROL_ESPERADO) + '". '
      + 'Vuelve al inicio y elige tu localidad y área de trabajo.</div>'
      + '<a class="btn btn-secundario" href="index.html" style="display:block;text-align:center;text-decoration:none;box-sizing:border-box">Volver al inicio</a></div>';
    return;
  }

  const pestana = PESTANA_POR_LOC[identidad.loc];
  dibujarMenu(identidad, pestana);
}

function dibujarMenu(identidad, pestana) {
  const cont = document.getElementById('contenido');
  cont.innerHTML =
    '<div class="carta">'
    + '<div class="quien"><span><b>' + esc(pestana) + '</b><br>Sesiones Informativas — Protección</span>'
    + '<button id="cambiar-identidad">no soy yo</button></div>'
    + '<button class="btn btn-enviar" id="ir-pre">Registrar PRE (sesión nueva)</button>'
    + '<button class="btn btn-secundario" id="ir-post">Registrar POST (sesión ya iniciada)</button>'
    + '</div>';
  document.getElementById('ir-pre').addEventListener('click', function () { dibujarFormularioPRE(identidad, pestana); });
  document.getElementById('ir-post').addEventListener('click', function () { dibujarFormularioPOST(identidad, pestana); });
  document.getElementById('cambiar-identidad').addEventListener('click', function () {
    borrarIdentidad();
    location.href = 'index.html';
  });
}

function leerArchivoComoBase64(archivo) {
  return new Promise(function (resolve, reject) {
    const lector = new FileReader();
    lector.onload = function () {
      const resultado = String(lector.result || '');
      const coma = resultado.indexOf(',');
      resolve(coma >= 0 ? resultado.slice(coma + 1) : resultado);
    };
    lector.onerror = function () { reject(new Error('No se pudo leer el archivo del celular.')); };
    lector.readAsDataURL(archivo);
  });
}

function opcionesRespuesta(valorActual) {
  const opciones = [['', '— sin marca —'], ['POCO', 'Poco'], ['ALGO', 'Algo'], ['MUCHO', 'Mucho']];
  return opciones.map(function (o) {
    const sel = o[0] === (valorActual || '') ? ' selected' : '';
    return '<option value="' + o[0] + '"' + sel + '>' + o[1] + '</option>';
  }).join('');
}

function dibujarFormularioPRE(identidad, pestana) {
  const cont = document.getElementById('contenido');
  const hoy = new Date().toISOString().slice(0, 10);
  const opcionesTema = TEMAS.map(function (t) { return '<option value="' + esc(t) + '">' + esc(t) + '</option>'; }).join('');

  let campoCanton;
  const cantones = CANTONES_POR_LOC[identidad.loc] || [];
  if (cantones.length > 1) {
    const opciones = cantones.map(function (c) { return '<option value="' + esc(c) + '">' + esc(c) + '</option>'; }).join('');
    campoCanton = '<label class="campo"><span class="etiqueta">Cantón</span><select id="canton">' + opciones + '</select></label>';
  } else {
    campoCanton = '<input type="hidden" id="canton" value="' + esc(cantones[0] || '') + '">';
  }

  cont.innerHTML =
    '<div class="carta">'
    + '<div class="titulo-pantalla">Registrar PRE</div>'
    + '<p class="subtitulo">' + esc(pestana) + ' — sube el PDF con los recortes PRE de esta sesión (uno por participante).</p>'
    + '<label class="campo"><span class="etiqueta">N.º de sesión</span><input type="number" min="1" max="200" id="numero-sesion"></label>'
    + '<label class="campo"><span class="etiqueta">Fecha</span><input type="date" id="fecha" value="' + hoy + '"></label>'
    + campoCanton
    + '<label class="campo"><span class="etiqueta">Sector / lugar de intervención</span><input type="text" id="sector" placeholder="Ej: Los Esteros"></label>'
    + '<button class="btn btn-secundario" id="verificar-sigla">Verificar sigla del sector</button>'
    + '<div id="resultado-sigla"></div>'
    + '<label class="campo"><span class="etiqueta">Tema</span><select id="tema">' + opcionesTema + '</select></label>'
    + '<label class="campo"><span class="etiqueta">PDF escaneado (todos los recortes PRE juntos)</span><input type="file" id="campo-pdf" accept="application/pdf"></label>'
    + '<button class="btn btn-enviar" id="btn-leer">Leer con Gemini</button>'
    + '<div id="resultado-pre"></div>'
    + '<button class="enlace-tenue" id="volver">← Volver</button>'
    + '</div>';

  document.getElementById('volver').addEventListener('click', function () { dibujarMenu(identidad, pestana); });

  document.getElementById('verificar-sigla').addEventListener('click', async function () {
    const sector = document.getElementById('sector').value.trim();
    const cajaResultado = document.getElementById('resultado-sigla');
    if (!sector) { cajaResultado.innerHTML = '<div class="aviso error">Escribe primero el nombre del sector.</div>'; return; }
    cajaResultado.innerHTML = '<p class="subtitulo">Verificando…</p>';
    try {
      const d = await llamarBackend({ accion: 'sugerirSigla', pestana: pestana, sector: sector });
      if (d.error) { cajaResultado.innerHTML = '<div class="aviso error">' + esc(d.error) + '</div>'; return; }
      if (d.existe) {
        cajaResultado.innerHTML = '<div class="aviso ok"><b>Ya está en el catálogo</b>Sigla: ' + esc(d.sigla) + '</div>';
      } else {
        cajaResultado.innerHTML =
          '<div class="aviso neutro"><b>Sector nuevo</b>Sigla sugerida: ' + esc(d.sugerencia) + '. '
          + 'Si prefieres otra, escríbela aquí (opcional):</div>'
          + '<input type="text" id="sigla-propia" maxlength="6" placeholder="Ej: ' + esc(d.sugerencia) + '" style="margin-top:6px">';
      }
    } catch (err) {
      cajaResultado.innerHTML = '<div class="aviso error">No se pudo verificar: ' + esc(err.message) + '</div>';
    }
  });

  document.getElementById('btn-leer').addEventListener('click', async function () {
    const cajaResultado = document.getElementById('resultado-pre');
    const numeroSesion = Number(document.getElementById('numero-sesion').value);
    const fecha = document.getElementById('fecha').value;
    const canton = document.getElementById('canton').value;
    const sector = document.getElementById('sector').value.trim();
    const tema = document.getElementById('tema').value;
    const archivo = document.getElementById('campo-pdf').files[0];
    const siglaPropia = document.getElementById('sigla-propia');

    if (!numeroSesion || !fecha || !sector) {
      cajaResultado.innerHTML = '<div class="aviso error">Falta número de sesión, fecha o sector.</div>';
      return;
    }
    if (!archivo) { cajaResultado.innerHTML = '<div class="aviso error">Falta el PDF con los recortes.</div>'; return; }
    if (archivo.size > 20 * 1024 * 1024) {
      cajaResultado.innerHTML = '<div class="aviso error">El PDF pesa demasiado. Máximo 20 MB.</div>';
      return;
    }

    const datosSesion = {
      tipo: 'PRE', numeroSesion: numeroSesion, fecha: fecha, canton: canton, sector: sector, tema: tema,
      siglaPersonalizada: siglaPropia ? siglaPropia.value.trim() : ''
    };

    cajaResultado.innerHTML = '<p class="subtitulo"><span class="girando"></span>Leyendo el PDF con Gemini — puede tardar unos segundos…</p>';
    try {
      const pdfBase64 = await leerArchivoComoBase64(archivo);
      const resp = await llamarBackend({ accion: 'leerPDFSesionInformativa', pdfBase64: pdfBase64, tema: tema });
      if (!resp || !resp.exito) throw new Error((resp && resp.error) || 'Gemini no pudo leer el PDF.');
      pantallaRevisionSesion(identidad, pestana, datosSesion, resp.hojas || []);
    } catch (err) {
      cajaResultado.innerHTML = '<div class="aviso error"><b>No se pudo leer el PDF</b>' + esc(err.message) + '</div>';
    }
  });
}

function dibujarFormularioPOST(identidad, pestana) {
  const cont = document.getElementById('contenido');
  cont.innerHTML =
    '<div class="carta">'
    + '<div class="titulo-pantalla">Registrar POST</div>'
    + '<p class="subtitulo">' + esc(pestana) + ' — sube el PDF con los recortes POST de esta sesión.</p>'
    + '<label class="campo"><span class="etiqueta">N.º de sesión</span><input type="number" min="1" max="200" id="numero-sesion"></label>'
    + '<label class="campo"><span class="etiqueta">PDF escaneado (todos los recortes POST juntos)</span><input type="file" id="campo-pdf" accept="application/pdf"></label>'
    + '<button class="btn btn-enviar" id="btn-leer">Leer con Gemini</button>'
    + '<div id="resultado-post"></div>'
    + '<button class="enlace-tenue" id="volver">← Volver</button>'
    + '</div>';

  document.getElementById('volver').addEventListener('click', function () { dibujarMenu(identidad, pestana); });

  document.getElementById('btn-leer').addEventListener('click', async function () {
    const cajaResultado = document.getElementById('resultado-post');
    const numeroSesion = Number(document.getElementById('numero-sesion').value);
    const archivo = document.getElementById('campo-pdf').files[0];

    if (!numeroSesion) { cajaResultado.innerHTML = '<div class="aviso error">Falta el número de sesión.</div>'; return; }
    if (!archivo) { cajaResultado.innerHTML = '<div class="aviso error">Falta el PDF con los recortes.</div>'; return; }
    if (archivo.size > 20 * 1024 * 1024) { cajaResultado.innerHTML = '<div class="aviso error">El PDF pesa demasiado. Máximo 20 MB.</div>'; return; }

    cajaResultado.innerHTML = '<p class="subtitulo">Consultando la sesión…</p>';
    try {
      const sesion = await llamarBackend({ accion: 'buscarSesion', pestana: pestana, numeroSesion: numeroSesion });
      if (sesion.error) throw new Error(sesion.error);
      if (!sesion.tema) throw new Error('Esta sesión no tiene PRE cargado todavía. Sube el PRE primero.');

      cajaResultado.innerHTML = '<p class="subtitulo"><span class="girando"></span>Leyendo el PDF con Gemini — puede tardar unos segundos…</p>';
      const pdfBase64 = await leerArchivoComoBase64(archivo);
      const resp = await llamarBackend({ accion: 'leerPDFSesionInformativa', pdfBase64: pdfBase64, tema: sesion.tema });
      if (!resp || !resp.exito) throw new Error((resp && resp.error) || 'Gemini no pudo leer el PDF.');
      pantallaRevisionSesion(identidad, pestana, { tipo: 'POST', numeroSesion: numeroSesion }, resp.hojas || []);
    } catch (err) {
      cajaResultado.innerHTML = '<div class="aviso error"><b>No se pudo continuar</b>' + esc(err.message) + '</div>';
    }
  });
}

function pantallaRevisionSesion(identidad, pestana, datosSesion, hojas) {
  const cont = document.getElementById('contenido');

  const tarjetas = hojas.map(function (hoja, i) {
    const marca = hoja.legible === false ? '<span class="marca-revisar">revisar</span>' : '';
    return '<div class="hoja-card"><div class="hoja-card-cabeza"><b>Hoja ' + (hoja.numeroHoja || (i + 1)) + '</b>' + marca + '</div>'
      + '<div class="pregunta-fila"><select data-hoja="' + i + '">' + opcionesRespuesta(hoja.respuesta) + '</select></div>'
      + '</div>';
  }).join('');

  cont.innerHTML =
    '<div class="carta">'
    + '<div class="titulo-pantalla">Revisa lo que leyó Gemini</div>'
    + '<p class="subtitulo">' + hojas.length + ' hoja(s) · ' + esc(datosSesion.tipo) + ' · sesión ' + esc(datosSesion.numeroSesion) + '. Corrige lo que haga falta antes de confirmar.</p>'
    + '<div class="total-vivo" id="resumen-conteo"></div>'
    + tarjetas
    + '<button class="btn btn-enviar" id="btn-confirmar">Confirmar y guardar</button>'
    + '<button class="btn btn-secundario" id="btn-volver-form">Volver a subir el PDF</button>'
    + '<div id="resultado-revision"></div>'
    + '</div>';

  function actualizarResumen() {
    const c = { POCO: 0, ALGO: 0, MUCHO: 0, '': 0 };
    hojas.forEach(function (h) { const v = h.respuesta || ''; c[v] = (c[v] || 0) + 1; });
    document.getElementById('resumen-conteo').textContent =
      'Poco: ' + c.POCO + ' — Algo: ' + c.ALGO + ' — Mucho: ' + c.MUCHO + ' — sin marca: ' + c[''];
  }
  actualizarResumen();

  cont.querySelectorAll('select[data-hoja]').forEach(function (sel) {
    sel.addEventListener('change', function () {
      hojas[Number(sel.getAttribute('data-hoja'))].respuesta = sel.value;
      actualizarResumen();
    });
  });

  document.getElementById('btn-volver-form').addEventListener('click', function () {
    if (datosSesion.tipo === 'PRE') dibujarFormularioPRE(identidad, pestana);
    else dibujarFormularioPOST(identidad, pestana);
  });

  document.getElementById('btn-confirmar').addEventListener('click', async function () {
    const cajaResultado = document.getElementById('resultado-revision');
    cajaResultado.innerHTML = '<p class="subtitulo">Guardando…</p>';
    try {
      const cuerpoBase = {
        accion: datosSesion.tipo === 'PRE' ? 'escribirPRE' : 'escribirPOST',
        pestana: pestana, numeroSesion: datosSesion.numeroSesion, rol: identidad.rol,
        poco: 0, algo: 0, mucho: 0, hojas: JSON.stringify(hojas)
      };
      const cuerpo = datosSesion.tipo === 'PRE'
        ? Object.assign(cuerpoBase, { fecha: datosSesion.fecha, canton: datosSesion.canton, sector: datosSesion.sector, tema: datosSesion.tema, siglaPersonalizada: datosSesion.siglaPersonalizada })
        : cuerpoBase;

      const d = await llamarBackend(cuerpo);
      if (d.error) { cajaResultado.innerHTML = '<div class="aviso error">' + esc(d.error) + '</div>'; return; }

      const total = datosSesion.tipo === 'PRE' ? d.totalPre : d.totalPost;
      cont.innerHTML =
        '<div class="carta"><div class="titulo-pantalla">Listo</div>'
        + '<div class="aviso ok"><b>' + esc(datosSesion.tipo) + ' guardado</b>'
        + (d.codigoRegistro ? 'Código de registro: ' + esc(d.codigoRegistro) + '<br>' : '')
        + 'Total marcado: ' + esc(total) + ' / 20</div>'
        + '<button class="btn btn-enviar" id="btn-otra">Registrar otra sesión</button></div>';
      document.getElementById('btn-otra').addEventListener('click', function () { dibujarMenu(identidad, pestana); });
    } catch (err) {
      cajaResultado.innerHTML = '<div class="aviso error">No se pudo guardar: ' + esc(err.message) + '</div>';
    }
  });
}

iniciar();

if ('serviceWorker' in navigator && navigator.serviceWorker) {
  try {
    navigator.serviceWorker.register('sw.js').catch(function (err) {
      console.warn('No se pudo activar el modo sin conexión:', err);
    });
  } catch (err) { console.warn('No se pudo activar el modo sin conexión:', err); }
}
</script>
</body>
</html>
