<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Paz y Esperanza</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icono-192.png">
<meta name="theme-color" content="#3F4A3C">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Paz y Esperanza">
<style>
:root{
  --papel:#F5F4F0; --carta:#FFFFFF; --tinta:#1A1D1A;
  --oliva:#3F4A3C; --linea:#E2E0DA; --apagado:#7A7C75;
  --senal:#9B2C1F; --ambar:#B8860B;
  --sans:-apple-system,'Segoe UI',system-ui,sans-serif;
  --mono:'SF Mono',Menlo,monospace;
}
body{font-family:var(--sans);background:var(--papel);color:var(--tinta);
  padding:20px 16px;line-height:1.5}
.envoltura{max-width:600px;margin:0 auto}
.marca{text-align:center;font-weight:700;color:var(--oliva);font-size:14px;
  letter-spacing:.03em;margin-bottom:10px}
.carta{background:var(--carta);border:1px solid var(--linea);
  border-radius:12px;padding:16px}
.btn{width:100%;padding:14px;border:0;border-radius:10px;font-size:15px;
  font-weight:600;font-family:inherit;cursor:pointer;margin-top:10px}
.btn-enviar{background:var(--oliva);color:#fff}
.aviso{border-radius:9px;padding:12px 13px;margin-top:11px;font-size:13px;line-height:1.5}
.aviso b{display:block;margin-bottom:4px}
.aviso.ok{background:#E3EFE0;color:#2C351F}
.aviso.error{background:#FBEBE8;color:#7B241A}
.aviso.neutro{background:#FDF3E3;color:#5C4210}
.titulo-pantalla{font-size:19px;font-weight:700;margin-bottom:4px}
.subtitulo{font-size:13px;color:var(--apagado);margin-bottom:16px}
.quien{border:1px solid var(--linea);border-radius:8px;padding:12px 13px;font-size:14px}
.quien b{display:block;font-size:16px;margin-bottom:2px}
.etiqueta{display:block;font-size:13px;font-weight:600;color:var(--oliva);margin:14px 0 6px}
.etiqueta:first-child{margin-top:0}
.campo select{width:100%;padding:11px 12px;border:1px solid var(--linea);border-radius:8px;
  font-family:inherit;font-size:15px;color:var(--tinta);background:#fff;box-sizing:border-box}
.enlace-tenue{display:block;text-align:center;margin-top:16px;font-size:13px;color:var(--apagado);
  text-decoration:underline;background:none;border:0;cursor:pointer;width:100%;font-family:inherit}
</style>
</head>
<body>
<div class="envoltura">
  <div class="marca">Paz y Esperanza</div>
  <div class="carta" id="contenido"><p>Cargando…</p></div>
</div>

<script>
const URL_BACKEND = 'PEGA_AQUI_LA_URL_/exec';

// Localidades y roles en el orden en que se muestran. Los valores (loc/rol)
// tienen que coincidir exactamente con los del backend (ENCUESTADORES en
// Codigo.gs), porque de ahí se calcula el código real.
const LOCALIDADES_SELECT = [
  { cod: 'MB', nombre: 'Manabí' }, { cod: 'G', nombre: 'Guayaquil' }, { cod: 'M', nombre: 'Milagro' }
];
const ROLES_SELECT = ['Trabajador social de protección', 'Asistente humanitario de protección',
                       'Asistente humanitario de gestión comunitaria', 'Psicólogo/a clínico'];
const NOMBRE_LOC = { MB: 'Manabí', G: 'Guayaquil', M: 'Milagro' };

// Los roles se renombraron; esto traduce lo que alguien ya tenga guardado en
// su dispositivo con el nombre viejo, para que no le salga "no reconocido".
const ROLES_ANTIGUOS_A_NUEVOS = {
  'Trabajo social': 'Trabajador social de protección',
  'Protección': 'Asistente humanitario de protección',
  'Asistente humanitario': 'Asistente humanitario de gestión comunitaria',
  'Psicología': 'Psicólogo/a clínico'
};

// Qué herramientas ve cada quien. 'roles: null' = visible para todos.
const HERRAMIENTAS = [
  { id: 'encuesta', nombre: 'Indicador de Protección', archivo: 'encuesta.html', roles: null },
  { id: 'taller', nombre: 'Ex Ante y Ex Post — Trabajo social', archivo: 'taller.html', roles: ['Trabajador social de protección'] },
  { id: 'proteccion', nombre: 'Sesiones Informativas — Protección', archivo: 'proteccion.html', roles: ['Asistente humanitario de protección'] }
  // Pendiente: una herramienta para "Asistente humanitario de gestión
  // comunitaria" — se agrega aquí cuando esté lista, con la misma lógica.
];
function herramientasPara(rol) {
  return HERRAMIENTAS.filter(function (h) { return !h.roles || h.roles.indexOf(rol) !== -1; });
}

function parametro(nombre){ return new URLSearchParams(location.search).get(nombre); }
const esc = s => String(s ?? '').replace(/[&<>"]/g,
  c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

// ---- lógica (idéntica a la ya probada con Node) ----
function buscarCodigo(encuestadores, loc, rol) {
  const claves = Object.keys(encuestadores);
  for (let i = 0; i < claves.length; i++) {
    const e = encuestadores[claves[i]];
    if (e.loc === loc && e.rol === rol) return claves[i];
  }
  return null;
}
function leerIdentidadLocal(storage) {
  try {
    const id = JSON.parse(storage.getItem('identidadLocal') || 'null');
    if (id && ROLES_ANTIGUOS_A_NUEVOS[id.rol]) id.rol = ROLES_ANTIGUOS_A_NUEVOS[id.rol];
    return id;
  } catch (e) { return null; }
}
function guardarIdentidadLocal(storage, loc, rol) { storage.setItem('identidadLocal', JSON.stringify({ loc, rol })); }
function borrarIdentidadLocal(storage) { storage.removeItem('identidadLocal'); }

async function cargar(){
  const cont = document.getElementById('contenido');
  try {
    const r = await fetch(URL_BACKEND);
    const d = await r.json();
    if (!d.ok) throw new Error('El backend no respondió correctamente.');
    localStorage.setItem('cache_encuestadores', JSON.stringify(d.encuestadores));
    dibujar(d.encuestadores, false);
  } catch (err) {
    const cache = localStorage.getItem('cache_encuestadores');
    if (cache) {
      dibujar(JSON.parse(cache), true);
    } else {
      cont.innerHTML = '<div class="titulo-pantalla">No se pudo conectar</div>'
        + '<div class="aviso error">' + esc(err.message) + ' Y no hay todavía una copia guardada en este dispositivo: hace falta abrir la página al menos una vez con señal.</div>';
    }
  }
}

function dibujar(encuestadores, sinConexion){
  const identidad = leerIdentidadLocal(localStorage);
  const avisoSinConexion = sinConexion
    ? '<div class="aviso neutro"><b>Trabajando sin conexión</b>Se está usando la última lista guardada en este dispositivo.</div>' : '';

  if (identidad && buscarCodigo(encuestadores, identidad.loc, identidad.rol)) {
    dibujarConfirmacion(identidad, avisoSinConexion);
  } else {
    dibujarSelector(avisoSinConexion);
  }
}

function dibujarConfirmacion(identidad, avisoSinConexion){
  const cont = document.getElementById('contenido');
  const herramientas = herramientasPara(identidad.rol);
  const botones = herramientas.map(function (h) {
    return '<a class="btn btn-enviar" href="' + h.archivo + '" style="display:block;text-align:center;text-decoration:none;box-sizing:border-box">' + esc(h.nombre) + '</a>';
  }).join('');
  cont.innerHTML =
    '<div class="titulo-pantalla">¿Qué vas a registrar?</div>'
    + avisoSinConexion
    + '<p class="subtitulo">Entrando como:</p>'
    + '<div class="quien"><b>' + esc(identidad.rol) + '</b>' + esc(NOMBRE_LOC[identidad.loc]) + '</div>'
    + botones
    + '<button class="enlace-tenue" id="cambiar">No soy yo — cambiar</button>';
  document.getElementById('cambiar').addEventListener('click', function () {
    borrarIdentidadLocal(localStorage);
    dibujarSelector('');
  });
}

function dibujarSelector(avisoSinConexion){
  const cont = document.getElementById('contenido');
  const opcionesLoc = LOCALIDADES_SELECT.map(function (l) { return '<option value="' + l.cod + '">' + esc(l.nombre) + '</option>'; }).join('');
  const opcionesRol = ROLES_SELECT.map(function (r) { return '<option value="' + esc(r) + '">' + esc(r) + '</option>'; }).join('');
  cont.innerHTML =
    '<div class="titulo-pantalla">¿Quién va a responder la encuesta?</div>'
    + avisoSinConexion
    + '<p class="subtitulo">Elige tu localidad y tu área de trabajo. Se va a guardar en este dispositivo para la próxima vez.</p>'
    + '<label class="campo"><span class="etiqueta">Localidad</span><select id="sel-loc">' + opcionesLoc + '</select></label>'
    + '<label class="campo"><span class="etiqueta">Área de trabajo</span><select id="sel-rol">' + opcionesRol + '</select></label>'
    + '<button class="btn btn-enviar" id="guardar">Guardar y comenzar</button>';
  document.getElementById('guardar').addEventListener('click', function () {
    const loc = document.getElementById('sel-loc').value;
    const rol = document.getElementById('sel-rol').value;
    guardarIdentidadLocal(localStorage, loc, rol);
    dibujarConfirmacion({ loc: loc, rol: rol }, '');
  });
}

cargar();

if ('serviceWorker' in navigator && navigator.serviceWorker) {
  try {
    navigator.serviceWorker.register('sw.js').catch(function (err) {
      console.warn('No se pudo activar el modo sin conexión:', err);
    });
  } catch (err) { console.warn('No se pudo activar el modo sin conexión:', err); }
}
</script>
</body>
</html>
